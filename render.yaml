services:
  - type: web
    name: agentgenia-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: checksPass
    healthCheckPath: /platformz
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 8787
      - key: ENFORCE_LIMITS
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: WRAPPER_SECRET
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_REDIRECT_URI
        sync: false
      - key: APPLE_CLIENT_ID
        value: com.agentgenia.ios
      - key: APPLE_TEAM_ID
        sync: false
      - key: APPLE_KEY_ID
        sync: false
      - key: APPLE_PRIVATE_KEY_BASE64
        sync: false
      - key: PUBLIC_LEGACY_SIGNUP_ENABLED
        value: "0"
      - key: STRIPE_ENABLED
        value: "1"
      - key: STRIPE_LIVE_MODE
        value: "1"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PLUS_PRICE_ID
        sync: false
      - key: STRIPE_PRO_PRICE_ID
        sync: false
      - key: STRIPE_SUCCESS_URL
        sync: false
      - key: STRIPE_CANCEL_URL
        sync: false
      - key: STRIPE_PORTAL_RETURN_URL
        sync: false
      - key: COMPOSIO_API_KEY
        sync: false
      - key: COMPOSIO_PUBLIC_URL
        sync: false
      - key: CONNECTOR_PUBLIC_URL
        sync: false
      - key: COMPOSIO_AUTH_CONFIGS_JSON
        sync: false
      - key: COMPOSIO_TOOLKIT_OVERRIDES_JSON
        value: "{}"
      - key: COMPUTERS_ENABLED
        value: "1"
      - key: DAYTONA_API_KEY
        sync: false
      - key: PI_ENABLED
        value: "1"
      - key: PI_CHROME_AUTO_AUTHORIZE
        value: "1"
      - key: PI_CHROME_ISOLATION
        value: per_run
