services:
  - type: web
    name: agentgenia-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: checksPass
    healthCheckPath: /readyz
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 8787
      - key: CREDITS_MODE
        value: enforce
      - key: CREDIT_LLM_MULTIPLIER_BPS
        value: "12500"
      - key: CREDIT_DISPLAY_INCREMENT_MILLI
        value: "100"
      - key: TRIAL_CREDITS
        value: "30"
      - key: TRIAL_CREDITS_TTL_DAYS
        value: "30"
      - key: DEFAULT_RUN_MAX_CREDITS
        value: "25"
      - key: DEEP_RUN_MAX_CREDITS
        value: "50"
      - key: CREDIT_RESERVATION_TTL_SECONDS
        value: "3900"
      - key: DATABASE_URL
        sync: false
      - key: WRAPPER_SECRET
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_REDIRECT_URI
        sync: false
      - key: WHATSAPP_ENABLED
        value: "1"
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_PUBLIC_NUMBER
        sync: false
      - key: WHATSAPP_GRAPH_VERSION
        value: v25.0
      - key: WHATSAPP_LINK_TTL_SECONDS
        value: "600"
      - key: APPLE_CLIENT_ID
        value: com.agentgenia.ios
      - key: APPLE_TEAM_ID
        sync: false
      - key: APPLE_KEY_ID
        sync: false
      - key: APPLE_PRIVATE_KEY_BASE64
        sync: false
      - key: PUBLIC_LEGACY_SIGNUP_ENABLED
        value: "0"
      - key: STRIPE_ENABLED
        value: "1"
      - key: STRIPE_LIVE_MODE
        value: "1"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_STARTER_PRICE_ID
        sync: false
      - key: STRIPE_PRO_PRICE_ID
        sync: false
      - key: STRIPE_BUSINESS_PRICE_ID
        sync: false
      - key: STRIPE_SUCCESS_URL
        sync: false
      - key: STRIPE_CANCEL_URL
        sync: false
      - key: STRIPE_PORTAL_RETURN_URL
        sync: false
      - key: COMPOSIO_API_KEY
        sync: false
      - key: COMPOSIO_PUBLIC_URL
        sync: false
      - key: CONNECTOR_PUBLIC_URL
        sync: false
      - key: COMPOSIO_AUTH_CONFIGS_JSON
        sync: false
      - key: COMPOSIO_DIRECT_AUTH_CONFIGS_JSON
        value: "{}"
      - key: COMPOSIO_TOOLKIT_OVERRIDES_JSON
        value: "{}"
      - key: COMPUTERS_ENABLED
        value: "0"
      - key: EXTERNAL_WRITES_ENABLED
        value: "0"
      - key: DAYTONA_API_KEY
        sync: false
      - key: PI_ENABLED
        value: "1"
      - key: PI_BIN
        value: /app/scripts/pi-render-safe
      - key: PI_WARM_SESSIONS
        value: "1"
      - key: PI_SESSION_IDLE_SECONDS
        value: "900"
      - key: PI_MAX_WARM_SESSIONS
        value: "4"
      - key: PI_MAX_CONCURRENT
        value: "4"
      - key: PI_CONNECTOR_THINKING
        value: off
      - key: PI_CHROME_AUTO_AUTHORIZE
        value: "1"
      - key: PI_CHROME_ISOLATION
        value: per_run
