name: Android

on:
  pull_request:
    paths:
      - ".github/workflows/android.yml"
      - ".gitignore"
      - "android/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/android.yml"
      - ".gitignore"
      - "android/**"

permissions:
  contents: read

jobs:
  debug-build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Test, lint, and assemble from clean checkout
        working-directory: android/AgentGenia
        run: ./gradlew clean testDebugUnitTest lintDebug assembleDebug

  instrumented-tests:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Install emulator SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platforms;android-35" "system-images;android-35;google_apis;arm64-v8a" "platform-tools" "emulator"
      - name: Run Keystore, launch, navigation, and Compose tests
        uses: reactivecircus/android-emulator-runner@324029e2f414c084d8b15ba075288885e74aef9c
        with:
          api-level: 35
          arch: arm64-v8a
          profile: pixel_6
          disable-animations: true
          working-directory: android/AgentGenia
          script: ./gradlew connectedDebugAndroidTest
