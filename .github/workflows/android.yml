name: Android

on:
  pull_request:
    paths:
      - ".github/workflows/android.yml"
      - ".gitignore"
      - "android/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/android.yml"
      - ".gitignore"
      - "android/**"

permissions:
  contents: read

jobs:
  debug-build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"
      - name: Test, lint, and assemble from clean checkout
        working-directory: android/AgentGenia
        run: ./gradlew clean testDebugUnitTest lintDebug assembleDebug
