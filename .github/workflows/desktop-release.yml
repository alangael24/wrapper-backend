name: Desktop Release

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing desktop-vX.Y.Z tag to release
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: desktop-release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    environment: production-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            command: dist:mac
            target: mac
            artifact: macos
          - os: windows-2025
            command: dist:win
            target: win
            artifact: windows
          - os: ubuntu-24.04
            command: dist:linux
            target: linux
            artifact: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      WINDOWS_APPX_PUBLISHER: ${{ secrets.WINDOWS_APPX_PUBLISHER }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify tag matches package version
        shell: bash
        run: |
          expected="desktop-v$(node -p 'require("./package.json").version')"
          test "$RELEASE_TAG" = "$expected" || { echo "Expected tag $expected"; exit 1; }
      - name: Require macOS signing and notarization secrets
        if: runner.os == 'macOS'
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          MAC_INSTALLER_CSC_LINK: ${{ secrets.MAC_INSTALLER_CSC_LINK }}
          MAC_INSTALLER_CSC_KEY_PASSWORD: ${{ secrets.MAC_INSTALLER_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          test -n "$MAC_CSC_LINK" && test -n "$MAC_CSC_KEY_PASSWORD"
          test -n "$MAC_INSTALLER_CSC_LINK" && test -n "$MAC_INSTALLER_CSC_KEY_PASSWORD"
          test -n "$APPLE_API_KEY_BASE64" && test -n "$APPLE_API_KEY_ID" && test -n "$APPLE_API_ISSUER"
          key="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$key"
          chmod 600 "$key"
          echo "APPLE_API_KEY=$key" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID" >> "$GITHUB_ENV"
          echo "APPLE_API_ISSUER=$APPLE_API_ISSUER" >> "$GITHUB_ENV"
          echo "CSC_LINK=$MAC_CSC_LINK" >> "$GITHUB_ENV"
          echo "CSC_KEY_PASSWORD=$MAC_CSC_KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "CSC_INSTALLER_LINK=$MAC_INSTALLER_CSC_LINK" >> "$GITHUB_ENV"
          echo "CSC_INSTALLER_KEY_PASSWORD=$MAC_INSTALLER_CSC_KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Require Windows signing secrets
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          WINDOWS_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CSC_LINK -or -not $env:WINDOWS_CSC_KEY_PASSWORD -or -not $env:WINDOWS_APPX_PUBLISHER) { throw "Windows signing secrets are incomplete" }
          "CSC_LINK=$env:WINDOWS_CSC_LINK" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CSC_KEY_PASSWORD=$env:WINDOWS_CSC_KEY_PASSWORD" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build signed distributables
        run: |
          pnpm build:desktop
          pnpm exec electron-builder --${{ matrix.target }} --publish never -c.forceCodeSigning=${{ runner.os != 'Linux' }}
      - name: Notarize and verify final macOS containers
        if: runner.os == 'macOS'
        run: |
          app_path="$(find release -type d -name '*.app' -print -quit)"
          test -n "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          spctl --assess --type execute --verbose=2 "$app_path"
          while IFS= read -r artifact; do
            xcrun notarytool submit "$artifact" --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait
            xcrun stapler staple "$artifact"
            xcrun stapler validate "$artifact"
          done < <(find release -type f \( -name '*.dmg' -o -name '*.pkg' \) -print)
          while IFS= read -r package; do
            pkgutil --check-signature "$package" | grep 'Developer ID Installer'
          done < <(find release -type f -name '*.pkg' -print)
      - name: Verify Windows Authenticode signatures
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $artifacts = Get-ChildItem release -Recurse -File | Where-Object { $_.Extension -in '.exe', '.appx' }
          if ($artifacts.Count -lt 2) { throw "Expected signed NSIS and AppX artifacts" }
          foreach ($artifact in $artifacts) {
            $signature = Get-AuthenticodeSignature $artifact.FullName
            if ($signature.Status -ne 'Valid') { throw "Invalid signature on $($artifact.Name): $($signature.Status)" }
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-release-${{ matrix.artifact }}
          path: |
            release/**/*.dmg
            release/**/*.pkg
            release/**/*.zip
            release/**/*.exe
            release/**/*.appx
            release/**/*.AppImage
            release/**/*.deb
            release/**/*.rpm
            release/**/*.blockmap
            release/**/latest*.yml
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    environment: production-release
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.19.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: desktop-release-*
          path: artifacts
      - run: node scripts/checksums.mjs artifacts
      - name: Stage and atomically publish the GitHub release
        run: |
          mapfile -d '' files < <(find artifacts -type f -print0)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true || { echo "Release already published"; exit 1; }
            gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${files[@]}" --draft --verify-tag --generate-notes --title "Agent Genia ${RELEASE_TAG#desktop-v}"
          fi
          gh release edit "$RELEASE_TAG" --draft=false --latest
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: artifacts/**
