name: iOS CI

on:
  pull_request:
    paths:
      - ".github/workflows/ios.yml"
      - "ios/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/ios.yml"
      - "ios/**"

permissions:
  contents: read

jobs:
  test-and-archive:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Select newest installed Xcode
        run: sudo xcode-select --switch "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"
      - name: Build test bundles from clean checkout
        run: |
          xcodebuild \
            -project ios/AgentGenia/AgentGenia.xcodeproj \
            -scheme AgentGenia \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build-for-testing
      - name: Run unit and UI tests
        run: |
          device_id="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for runtime in reversed(list(d.values())) for x in runtime if x["name"].startswith("iPhone") and x["isAvailable"]))')"
          xcrun simctl boot "$device_id" || true
          xcrun simctl bootstatus "$device_id" -b
          xcodebuild \
            -project ios/AgentGenia/AgentGenia.xcodeproj \
            -scheme AgentGenia \
            -destination "platform=iOS Simulator,id=$device_id" \
            test
      - name: Validate unsigned Release archive
        run: |
          xcodebuild \
            -project ios/AgentGenia/AgentGenia.xcodeproj \
            -scheme AgentGenia \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/AgentGenia.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            archive
