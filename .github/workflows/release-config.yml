name: Release Configuration

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "electron-builder.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "scripts/verify-release-config.mjs"
      - "Dockerfile"
      - ".dockerignore"
      - "render.yaml"
      - "ios/AgentGenia/AgentGenia.xcodeproj/**"
      - "ios/AgentGenia/AgentGenia/PrivacyInfo.xcprivacy"
      - "android/AgentGenia/app/build.gradle.kts"
      - "LICENSE"
      - "*.md"
      - "docs/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "electron-builder.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "scripts/verify-release-config.mjs"
      - "Dockerfile"
      - ".dockerignore"
      - "render.yaml"
      - "ios/AgentGenia/AgentGenia.xcodeproj/**"
      - "ios/AgentGenia/AgentGenia/PrivacyInfo.xcprivacy"
      - "android/AgentGenia/app/build.gradle.kts"
      - "LICENSE"
      - "*.md"
      - "docs/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:verify
      - name: Parse every workflow as YAML
        run: ruby -e 'require "yaml"; Dir[".github/workflows/*.yml"].each { |file| YAML.load_file(file) }'
