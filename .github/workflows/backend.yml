name: Backend CI

on:
  pull_request:
    paths:
      - ".github/workflows/backend.yml"
      - ".dockerignore"
      - "Dockerfile"
      - "render.yaml"
      - "supabase/migrations/**"
      - "go_backend/**"
      - "extensions/**"
      - "scripts/**"
      - "tests/**"
      - "requirements.in"
      - "requirements.txt"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/backend.yml"
      - ".dockerignore"
      - "Dockerfile"
      - "render.yaml"
      - "supabase/migrations/**"
      - "go_backend/**"
      - "extensions/**"
      - "scripts/**"
      - "tests/**"
      - "requirements.in"
      - "requirements.txt"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

permissions:
  contents: read

jobs:
  postgres-migrations:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agentgenia_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agentgenia_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: agentgenia_ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Create Supabase compatibility roles
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          create role anon nologin;
          create role authenticated nologin;
          create role service_role nologin;
          create role agentgenia_app nologin;
          SQL
      - name: Apply every production migration from an empty PostgreSQL 17 database
        run: |
          for migration in supabase/migrations/*.sql; do
            echo "Applying $migration"
            psql -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Assert production schema and Business entitlement
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          insert into agentgenia.users(id,name,email,api_key_hash,tier,created_at)
          values ('ci_business','CI','ci@example.com','ci_hash','business',extract(epoch from now()));
          insert into agentgenia.billing_subscriptions(
            stripe_subscription_id,user_id,tier,status,updated_at
          ) values ('sub_ci_business','ci_business','business','active',extract(epoch from now()));
          do $$ begin
            if (select v from agentgenia.kv where k='schema_version') <> '16' then
              raise exception 'unexpected schema version';
            end if;
          end $$;
          SQL

  tests:
    needs: postgres-migrations
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.11"
          cache: pip
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - name: Install sandbox prerequisites
        run: sudo apt-get update && sudo apt-get install -y bubblewrap socat util-linux
      - run: pip install --require-hashes -r requirements.txt
      - name: Audit locked backend dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          pip-audit --require-hashes --disable-pip -r requirements.txt
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: pnpm test:desktop
      - run: pnpm test:connectors

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build production image from clean checkout
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          load: true
          tags: agentgenia/backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify development boot inside the image
        run: |
          id="$(docker run -d -e ENVIRONMENT=development -e HOST=0.0.0.0 -p 127.0.0.1:8787:8787 agentgenia/backend:ci)"
          trap 'docker logs "$id"; docker rm -f "$id"' EXIT
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8787/healthz && exit 0
            sleep 1
          done
          exit 1
