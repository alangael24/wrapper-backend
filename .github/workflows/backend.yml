name: Backend CI

on:
  pull_request:
    paths:
      - ".github/workflows/backend.yml"
      - ".dockerignore"
      - "Dockerfile"
      - "render.yaml"
      - "go_backend/**"
      - "extensions/**"
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/backend.yml"
      - ".dockerignore"
      - "Dockerfile"
      - "render.yaml"
      - "go_backend/**"
      - "extensions/**"
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.11"
          cache: pip
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - name: Install sandbox prerequisites
        run: sudo apt-get update && sudo apt-get install -y bubblewrap socat util-linux
      - run: pip install -r requirements.txt
      - run: pnpm install --frozen-lockfile
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: pnpm test:desktop
      - run: pnpm test:connectors

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build production image from clean checkout
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          load: true
          tags: agentgenia/backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify development boot inside the image
        run: |
          id="$(docker run -d -e ENVIRONMENT=development -e HOST=0.0.0.0 -p 127.0.0.1:8787:8787 agentgenia/backend:ci)"
          trap 'docker logs "$id"; docker rm -f "$id"' EXIT
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8787/healthz && exit 0
            sleep 1
          done
          exit 1
