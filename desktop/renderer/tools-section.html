<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark" />
<title>Agent Genia · Herramientas</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0c0d0f;
    --bg2: #101216;
    --surface: #17191f;
    --surface2: #1d2027;
    --line: #262a33;
    --text: #f2f3f5;
    --muted: #9aa0ab;
    --faint: #6b7079;
    --accent: #2f91f5;
    --accent-soft: rgba(47, 145, 245, .14);
    --teal: #18bda7;
    --ok: #08be70;
    --ok-soft: rgba(8, 190, 112, .14);
    --warn: #ffb224;
    --radius: 16px;
    --shadow: 0 18px 44px rgba(0,0,0,.35);
    --font: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: var(--font);
    background:
      radial-gradient(1100px 480px at 50% -12%, #16233a 0%, rgba(22,35,58,0) 62%),
      radial-gradient(700px 420px at 8% 108%, rgba(24,189,167,.07) 0%, rgba(24,189,167,0) 60%),
      radial-gradient(700px 420px at 94% 108%, rgba(47,145,245,.09) 0%, rgba(47,145,245,0) 60%),
      var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 3px solid rgba(47,145,245,.55); outline-offset: 2px; border-radius: 10px; }
  #app { height: 100%; }

  /* ---------- screen ---------- */
  .screen {
    position: relative;
    height: 100%;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 54px 26px 40px;
    scrollbar-color: #2c3038 transparent;
  }
  .screen::-webkit-scrollbar { width: 10px; }
  .screen::-webkit-scrollbar-thumb { background: #2c3038; border-radius: 8px; }

  .mascot-float { position: absolute; top: 46px; z-index: 0; opacity: .9; pointer-events: none; animation: float 7s ease-in-out infinite; }
  .mascot-float.left { left: max(28px, calc(50% - 560px)); }
  .mascot-float.right { right: max(28px, calc(50% - 560px)); animation-delay: -3.2s; }
  @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-9px) } }

  .blob {
    position: relative; display: block; width: var(--s); height: var(--s);
    background: var(--c); border-radius: 54% 46% 57% 43% / 48% 56% 44% 52%;
    box-shadow: 0 10px 34px color-mix(in srgb, var(--c) 42%, transparent);
  }
  .blob::before, .blob::after {
    content: ""; position: absolute; top: 36%; width: 11%; height: 26%; border-radius: 999px;
    background: #fff; transform: rotate(-8deg);
  }
  .blob::before { left: 33%; }
  .blob::after { right: 30%; transform: rotate(8deg); }
  .blob.sm { --s: 46px; }
  .blob.lg { --s: 104px; animation: blobIdle 6s ease-in-out infinite; }
  @keyframes blobIdle { 0%,100% { transform: scale(1) } 50% { transform: scale(1.05) } }

  .head { position: relative; z-index: 1; width: min(760px, 100%); text-align: center; animation: rise .55s ease both; }
  .eyebrow { color: var(--teal); font-size: 11px; font-weight: 800; letter-spacing: .22em; text-transform: uppercase; }
  .head h1 { margin: 14px 0 0; font-size: clamp(34px, 4.4vw, 54px); font-weight: 640; letter-spacing: -.03em; line-height: 1.04; }
  .head p { max-width: 560px; margin: 16px auto 0; color: var(--muted); font-size: 15px; line-height: 1.6; }

  /* ---------- account banner ---------- */
  .account {
    position: relative; z-index: 1;
    display: grid; grid-template-columns: auto minmax(0,1fr) auto; align-items: center; gap: 12px;
    width: min(600px, 100%); margin-top: 24px;
    border: 1px solid var(--line); border-radius: 18px;
    background: linear-gradient(180deg, #17191f, #14161b);
    padding: 11px 14px; animation: rise .55s .06s ease both;
    box-shadow: 0 12px 34px rgba(0,0,0,.22);
  }
  .account.connected { border-color: rgba(8,190,112,.4); background: linear-gradient(180deg, #14201a, #12171a); }
  .account-avatar {
    display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%;
    background: linear-gradient(135deg, #f35ca7, #8654ed); color: #fff; font-size: 12px; font-weight: 800;
  }
  .account-copy { display: grid; gap: 2px; min-width: 0; }
  .account-copy strong { font-size: 12.5px; }
  .account-copy small { color: var(--muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .account button, .connect {
    border: 0; border-radius: 999px; padding: 7px 13px; font-size: 11px; font-weight: 750;
    background: #23262e; color: var(--text); transition: background .15s, transform .1s;
  }
  .account button:hover { background: #2d313b; }
  .account.connected button { background: var(--ok-soft); color: #46d693; }
  .account button:disabled { opacity: .6; cursor: wait; }

  /* ---------- search ---------- */
  .search {
    position: relative; z-index: 1;
    display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px;
    width: min(620px, 100%); margin-top: 30px;
    border: 1px solid var(--line); border-radius: 999px;
    background: rgba(23,25,31,.92); padding: 0 18px;
    box-shadow: 0 10px 30px rgba(0,0,0,.25);
    animation: rise .55s .1s ease both;
  }
  .search:focus-within { border-color: rgba(47,145,245,.55); box-shadow: 0 0 0 4px var(--accent-soft), 0 10px 30px rgba(0,0,0,.25); }
  .search .glass { font-size: 20px; color: var(--faint); }
  .search input { width: 100%; border: 0; outline: 0; background: transparent; padding: 15px 0; font-size: 15px; }
  .search input::placeholder { color: var(--faint); }
  .search .count {
    border-radius: 999px; background: #23262e; padding: 5px 11px;
    color: var(--muted); font-size: 11px; font-weight: 700; white-space: nowrap;
  }
  .search .count.hot { background: var(--accent-soft); color: #8ec3ff; }

  /* ---------- groups & grid ---------- */
  .groups { position: relative; z-index: 1; display: grid; gap: 24px; width: min(1000px, 100%); margin-top: 30px; padding-bottom: 8px; }
  .group-title { display: flex; align-items: center; gap: 9px; padding: 0 4px; }
  .group-title strong { font-size: 12.5px; letter-spacing: .02em; }
  .group-title span {
    display: grid; place-items: center; min-width: 21px; height: 21px; border-radius: 11px;
    background: #23262e; color: var(--muted); font-size: 10px; font-weight: 750;
  }
  .grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 12px; }

  .card {
    position: relative;
    display: grid; grid-template-columns: minmax(0,1fr) auto; align-items: end; gap: 8px;
    min-height: 116px; padding: 12px;
    border: 1px solid var(--line); border-radius: var(--radius);
    background: linear-gradient(180deg, #181a20, #14161b);
    opacity: 0; animation: rise .5s cubic-bezier(.2,.7,.3,1) both; animation-delay: calc(.05s + var(--i) * 34ms);
    transition: border-color .18s, background .18s, transform .18s, box-shadow .18s;
  }
  .card:hover { transform: translateY(-2px); border-color: #3a4150; box-shadow: var(--shadow); }
  .card.selected { border-color: rgba(47,145,245,.6); background: linear-gradient(180deg, #15202f, #131821); box-shadow: inset 0 0 0 1px rgba(47,145,245,.25), 0 14px 34px rgba(0,0,0,.25); }
  .card.connected { border-color: rgba(8,190,112,.5); background: linear-gradient(180deg, #15231c, #13181a); }
  .card.selected.connected { border-color: rgba(8,190,112,.65); }

  .card-main {
    display: grid; grid-column: 1 / -1; grid-template-columns: auto minmax(0,1fr) auto; align-items: center; gap: 13px;
    width: 100%; border: 0; background: transparent; padding: 2px; text-align: left;
  }
  .tile {
    display: grid; place-items: center; width: 42px; height: 42px; border-radius: 12px;
    background: #0f1115; box-shadow: 0 0 0 1px #2a2e37, 0 8px 20px rgba(0,0,0,.3);
    flex: 0 0 auto;
  }
  .tile svg { width: 24px; height: 24px; }
  .tile .icon-fallback {
    display: grid; place-items: center; width: 24px; height: 24px; border-radius: 7px;
    background: #23262e; color: #dfe3ea; font-size: 9px; font-weight: 800; letter-spacing: .02em;
  }
  .copy { display: grid; min-width: 0; gap: 4px; }
  .copy strong { font-size: 15px; font-weight: 620; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .copy small { color: var(--muted); font-size: 10.5px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .check {
    display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%;
    background: #23262e; color: #8b909a; font-size: 12px; font-weight: 800;
    transition: background .16s, color .16s, transform .16s;
  }
  .card.selected .check { background: var(--accent); color: #fff; box-shadow: 0 0 0 3px var(--accent-soft); }
  .card.connected .check { background: var(--ok); box-shadow: 0 0 0 3px var(--ok-soft); }
  .card.selected.connected .check { background: var(--ok); color: #06130d; }

  .connect { justify-self: end; }
  .connect:hover { background: #2d313b; }
  .connect.connected { background: var(--ok-soft); color: #46d693; cursor: default; }
  .connect.connected:hover { background: var(--ok-soft); }
  .connect.unavailable { background: #1b1e24; color: var(--faint); cursor: default; }
  .connect.unavailable:hover { background: #1b1e24; }
  .connect:disabled:not(.unavailable) { opacity: .65; cursor: wait; }

  /* ---------- footer ---------- */
  .actions { position: relative; z-index: 1; display: grid; gap: 10px; width: min(580px, 100%); margin-top: 34px; animation: rise .5s .22s ease both; }
  .primary, .ghost { border: 0; border-radius: 16px; padding: 15px 22px; font-size: 14px; font-weight: 750; transition: transform .12s, background .15s, opacity .15s; }
  .primary { background: var(--text); color: #0b0c0e; }
  .primary:hover { background: #fff; transform: translateY(-1px); }
  .primary:disabled { opacity: .5; cursor: wait; }
  .ghost { background: #1c1f26; color: var(--muted); }
  .ghost:hover { background: #242833; color: var(--text); }

  .error { color: #ff7b8a; font-size: 12.5px; margin: 12px 0 0; text-align: center; }

  /* ---------- empty search ---------- */
  .empty { display: grid; justify-items: center; gap: 8px; padding: 54px 20px; color: var(--muted); text-align: center; }
  .empty strong { color: var(--text); font-size: 15px; }
  .empty span { font-size: 12.5px; }

  /* ---------- modal (OAuth sim) ---------- */
  .backdrop {
    position: fixed; inset: 0; z-index: 50; display: grid; place-items: center;
    background: rgba(5,6,8,.66); backdrop-filter: blur(7px);
    animation: fade .18s ease both; padding: 20px;
  }
  .modal {
    width: min(420px, 100%); border: 1px solid #2c3039; border-radius: 22px;
    background: linear-gradient(180deg, #191c22, #121419);
    padding: 26px; text-align: center; box-shadow: 0 30px 90px rgba(0,0,0,.55);
    animation: pop .28s cubic-bezier(.2,.8,.3,1.1) both;
  }
  .modal .tile { margin: 0 auto 14px; width: 56px; height: 56px; border-radius: 16px; }
  .modal .tile svg { width: 32px; height: 32px; }
  .modal h2 { margin: 0; font-size: 19px; font-weight: 650; letter-spacing: -.01em; }
  .modal p { margin: 10px auto 0; max-width: 320px; color: var(--muted); font-size: 12.5px; line-height: 1.55; }
  .account-row {
    display: grid; grid-template-columns: auto minmax(0,1fr) auto; align-items: center; gap: 10px;
    margin-top: 18px; border: 1px solid var(--line); border-radius: 14px; background: #121419; padding: 10px 12px; text-align: left;
  }
  .account-row .account-avatar { width: 30px; height: 30px; font-size: 11px; }
  .account-row b { display: block; font-size: 12.5px; }
  .account-row small { display: block; color: var(--muted); font-size: 11px; }
  .account-row em { font-style: normal; font-size: 9.5px; font-weight: 750; color: var(--ok); }
  .modal-actions { display: grid; grid-template-columns: 1fr 1.4fr; gap: 10px; margin-top: 20px; }
  .modal-actions button { border: 0; border-radius: 14px; padding: 12px; font-size: 13px; font-weight: 750; }
  .modal-actions .cancel { background: #1c1f26; color: var(--muted); }
  .modal-actions .cancel:hover { background: #242833; color: var(--text); }
  .modal-actions .authorize { background: var(--text); color: #0b0c0e; }
  .modal-actions .authorize:hover { background: #fff; }
  .modal-actions .authorize:disabled { opacity: .55; cursor: wait; }
  .modal .spinner {
    width: 18px; height: 18px; margin: 0 auto; border: 2.5px solid #0b0c0e; border-top-color: transparent;
    border-radius: 50%; animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg) } }
  .modal .done-tick { width: 46px; height: 46px; margin: 0 auto; border-radius: 50%; background: var(--ok-soft); color: #46d693; display: grid; place-items: center; font-size: 22px; animation: pop .3s cubic-bezier(.2,.8,.3,1.2) both; }

  /* ---------- done view ---------- */
  .done-view { display: grid; justify-items: center; text-align: center; padding-top: 9vh; }
  .done-view h1 { margin: 26px 0 0; font-size: clamp(30px, 4vw, 46px); font-weight: 640; letter-spacing: -.03em; }
  .done-view p { max-width: 460px; margin: 14px 0 0; color: var(--muted); font-size: 14.5px; line-height: 1.6; }
  .summary {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 9px; max-width: 620px; margin-top: 26px;
  }
  .chip {
    display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 999px;
    background: #17191f; padding: 6px 12px 6px 7px; font-size: 12px; font-weight: 650; animation: rise .4s both; animation-delay: calc(var(--i) * 45ms);
  }
  .chip .tile { width: 24px; height: 24px; border-radius: 7px; }
  .chip .tile svg { width: 14px; height: 14px; }
  .chip .tile .icon-fallback { width: 14px; height: 14px; font-size: 6px; }
  .chip b { color: var(--ok); font-weight: 800; }
  .chip.off { color: var(--muted); }

  /* ---------- toast ---------- */
  .toast {
    position: fixed; left: 50%; bottom: 26px; z-index: 60; transform: translate(-50%, 14px);
    display: flex; align-items: center; gap: 10px;
    border: 1px solid rgba(8,190,112,.45); border-radius: 999px; background: #12211a; color: #c9f2dd;
    padding: 11px 18px; font-size: 12.5px; font-weight: 650; box-shadow: 0 16px 44px rgba(0,0,0,.4);
    opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @keyframes rise { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: translateY(0) } }
  @keyframes fade { from { opacity: 0 } to { opacity: 1 } }
  @keyframes pop { from { opacity: 0; transform: scale(.92) } to { opacity: 1; transform: scale(1) } }

  @media (max-width: 1080px) {
    .grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
    .mascot-float { display: none; }
  }
  @media (max-width: 680px) {
    .screen { padding: 40px 16px 32px; }
    .grid { grid-template-columns: 1fr; }
    .actions { width: 100%; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001s !important; transition-duration: .001s !important; }
  }
</style>
</head>

// Solo estos conectores tienen OAuth público configurado (igual que desktop/src/oauth.ts)
const AVAILABLE = new Set(["google-workspace", "microsoft-365", "hubspot", "salesforce"]);
const GROUPS = ["Trabajo", "Ventas", "Desarrollo", "Diseño", "Comercio"];
const LS = {
  selected: "agentgenia.tools.selected",
  connections: "agentgenia.tools.connections",
  account: "agentgenia.tools.account"
};
const ACCOUNT_DEFAULT = { connected: false, email: "", name: "" };

const state = {
  query: "",
  selected: new Set(readJson(LS.selected, [])),
  connections: readJson(LS.connections, {}),   // connectorId -> { email, name }
  account: readJson(LS.account, ACCOUNT_DEFAULT),
  authBusy: "",          // connectorId en OAuth
  accountBusy: false,
  error: "",
  modal: null,           // { connectorId } | { kind: "account" }
  modalPhase: null,
  doneView: false
};

const app = document.getElementById("app");

function readJson(key, fallback) {
  try { const v = JSON.parse(localStorage.getItem(key)); return v ?? fallback; } catch { return fallback; }
}
function write(key, value) { localStorage.setItem(key, JSON.stringify(value)); }
function esc(value) {
  return String(value).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" })[c]);
}
function toast(message) {
  let el = document.querySelector(".toast");
  if (!el) { el = document.createElement("div"); el.className = "toast"; document.body.appendChild(el); }
  el.textContent = message;
  requestAnimationFrame(() => el.classList.add("show"));
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove("show"), 2600);
}
function blob(color, size = "sm") {
  return `<span class="blob ${size}" style="--c:${color}" aria-hidden="true"></span>`;
}

function connector(id) { return CATALOG.find((c) => c.id === id); }
function connectionOf(id) { return state.connections[id] ?? null; }
function isConnected(id) { return Boolean(connectionOf(id)); }

function render() {
  if (state.doneView) { renderDone(); return; }
  const q = state.query.trim().toLocaleLowerCase("es");
  const visible = CATALOG.filter((c) => !q || (c.name + " " + c.category + " " + c.description).toLocaleLowerCase("es").includes(q));
  const anyMatch = visible.length > 0;

  app.innerHTML = `
    <main class="screen">
      <div class="mascot-float left">${blob("#18bda7")}</div>
      <div class="mascot-float right">${blob("#2f91f5")}</div>

      <header class="head">
        <span class="eyebrow">Conecta tu flujo</span>
        <h1>¿Qué usas todos los días?</h1>
        <p>Elige las herramientas y autoriza tu propia cuenta. Las sesiones quedan cifradas en este dispositivo y nunca se comparten con otros usuarios.</p>
      </header>

      ${renderAccount()}

      <label class="search">
        <span class="glass" aria-hidden="true">⌕</span>
        <input id="q" type="search" placeholder="Buscar herramientas" value="${esc(state.query)}" autocomplete="off" />
        <span class="count${state.selected.size ? " hot" : ""}">${state.selected.size} elegida${state.selected.size === 1 ? "" : "s"}</span>
      </label>

      <section class="groups">
        ${GROUPS.map((group) => {
          const items = visible.filter((c) => c.category === group);
          if (!items.length) return "";
          return `
            <div class="group">
              <div class="group-title"><strong>${group}</strong><span>${items.length}</span></div>
              <div class="grid">
                ${items.map((c, index) => {
                  const selected = state.selected.has(c.id);
                  const connected = isConnected(c.id);
                  const available = AVAILABLE.has(c.id);
                  return `
                    <article class="card${selected ? " selected" : ""}${connected ? " connected" : ""}" style="--i:${index}">
                      <button class="card-main" type="button" data-id="${c.id}" aria-pressed="${selected}">
                        <span class="tile">${c.svg}</span>
                        <span class="copy"><strong>${c.name}</strong><small>${c.description}</small></span>
                        <span class="check" aria-hidden="true">${selected ? "✓" : "+"}</span>
                      </button>
                      ${renderConnect(c, available, connected)}
                    </article>`;
                }).join("")}
              </div>
            </div>`;
        }).join("")}
        ${anyMatch ? "" : `<div class="empty"><strong>No encontramos esa herramienta.</strong><span>Prueba con otro nombre o categoría.</span></div>`}
      </section>

      ${state.error ? `<p class="error" role="alert">${esc(state.error)}</p>` : ""}

      <footer class="actions">
        <button id="next" class="primary" type="button">${state.selected.size ? `Siguiente · ${state.selected.size} ${state.selected.size === 1 ? "herramienta" : "herramientas"}` : "Siguiente"}</button>
        <button id="skip" class="ghost" type="button">Omitir por ahora</button>
      </footer>
    </main>
    ${renderModal()}`;

  const input = document.getElementById("q");
  input.focus();
  input.setSelectionRange(input.value.length, input.value.length);
  input.addEventListener("input", () => { state.query = input.value; render(); });

  for (const card of document.querySelectorAll("[data-id]")) {
    card.addEventListener("click", () => {
      const id = card.dataset.id;
      if (state.selected.has(id)) state.selected.delete(id); else state.selected.add(id);
      write(LS.selected, [...state.selected]);
      render();
    });
  }
  document.querySelectorAll("[data-connect]").forEach((btn) => {
    btn.addEventListener("click", () => openOAuth(btn.dataset.connect));
  });
  document.querySelectorAll("[data-sign-in]").forEach((btn) => btn.addEventListener("click", () => openOAuth({ kind: "account" })));
  document.querySelectorAll("[data-sign-out]").forEach((btn) => btn.addEventListener("click", signOut));
  document.getElementById("next").addEventListener("click", () => { state.doneView = true; state.modal = null; render(); });
  document.getElementById("skip").addEventListener("click", () => { state.doneView = true; state.modal = null; render(); });
}

function renderConnect(c, available, connected) {
  if (state.authBusy === c.id) {
    return `<button class="connect" type="button" disabled>Esperando…</button>`;
  }
  if (!available) {
    return `<button class="connect unavailable" type="button" disabled title="OAuth no configurado">Próximamente</button>`;
  }
  if (connected) {
    const who = connectionOf(c.id).name || connectionOf(c.id).email || "";
    return `<button class="connect connected" type="button" data-disconnect="${c.id}" title="Desconectar ${esc(who)}">✓ Conectado</button>`;
  }
  return `<button class="connect" type="button" data-connect="${c.id}">Conectar</button>`;
}

function renderAccount() {
  const a = state.account;
  if (a.connected) {
    return `
      <section class="account connected">
        <span class="account-avatar">${esc((a.name || a.email || "A").slice(0, 1).toUpperCase())}</span>
        <span class="account-copy"><strong>Sesión personal activa</strong><small>${esc(a.email)}</small></span>
        <button type="button" data-sign-out ${state.accountBusy ? "disabled" : ""}>Salir</button>
      </section>`;
  }
  return `
    <section class="account">
      <span class="account-avatar">A</span>
      <span class="account-copy"><strong>Conecta tus propias cuentas</strong><small>Inicia sesión una vez y después autoriza cada proveedor.</small></span>
      <button type="button" data-sign-in ${state.accountBusy ? "disabled" : ""}>${state.accountBusy ? "Abriendo…" : "Iniciar sesión"}</button>
    </section>`;
}

function openOAuth(target) {
  state.modal = target;
  state.modalPhase = "idle";
  render();
}

function renderModal() {
  if (!state.modal) return "";
  const isAccount = state.modal.kind === "account";
  const c = isAccount ? null : connector(state.modal.connectorId);
  const title = isAccount ? "Tu cuenta de Agent Genia" : `Conectar con ${c.name}`;
  const body = isAccount
    ? "Autoriza tu cuenta principal. Después podrás conectar cada proveedor con esa misma sesión."
    : `Autorizarás una sesión cifrada y exclusiva para tu usuario en este dispositivo.`;
  const providerTile = isAccount
    ? `<span class="tile" style="width:56px;height:56px;border-radius:16px">${blob("#18bda7")}</span>`
    : `<span class="tile" style="width:56px;height:56px;border-radius:16px">${c.svg}</span>`;

  let inner;
  if (state.modalPhase === "working") {
    inner = `<div class="spinner" role="status" aria-label="Autorizando"></div>`;
  } else if (state.modalPhase === "done") {
    inner = `<div class="done-tick" aria-hidden="true">✓</div>`;
  } else {
    inner = `
      <div class="account-row">
        <span class="account-avatar">J</span>
        <span><b>Juan Pérez</b><small>juan@agentgenia.dev</small></span>
        <em>tu cuenta</em>
      </div>
      <div class="modal-actions">
        <button class="cancel" type="button" data-close>Cancelar</button>
        <button class="authorize" type="button" data-authorize>Autorizar</button>
      </div>`;
  }

  return `
    <div class="backdrop">
      <div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}">
        ${providerTile}
        <h2>${esc(title)}</h2>
        <p>${esc(body)}</p>
        <div style="margin-top:${state.modalPhase === "idle" ? "0" : "14px"}">${inner}</div>
      </div>
    </div>`;

}

function bindModal() {
  const backdrop = document.querySelector(".backdrop");
  if (!backdrop) return;
  backdrop.addEventListener("click", (event) => {
    if (event.target === backdrop && state.modalPhase !== "working") closeModal();
  });
  const close = document.querySelector("[data-close]");
  if (close) close.addEventListener("click", closeModal);
  const authorize = document.querySelector("[data-authorize]");
  if (authorize) authorize.addEventListener("click", authorizeCurrent);
}

function closeModal() { state.modal = null; state.modalPhase = null; render(); }

async function authorizeCurrent() {
  const modal = state.modal;
  if (!modal || state.modalPhase === "working") return;
  state.modalPhase = "working";
  render();
  await delay(1400);
  if (modal.kind === "account") {
    state.account = { connected: true, email: "juan@agentgenia.dev", name: "Juan Pérez" };
    write(LS.account, state.account);
  } else {
    state.connections[modal.connectorId] = { email: "juan@agentgenia.dev", name: "Juan Pérez" };
    write(LS.connections, state.connections);
    state.selected.add(modal.connectorId);
    write(LS.selected, [...state.selected]);
  }
  state.modalPhase = "done";
  render();
  await delay(800);
  state.modal = null;
  state.modalPhase = null;
  const name = modal.kind === "account" ? "Sesión iniciada" : `${connector(modal.connectorId).name} conectado`;
  toast(`${name} · sesión cifrada en este dispositivo`);
  render();
}

function signOut() {
  state.accountBusy = true;
  render();
  setTimeout(() => {
    state.account = { ...ACCOUNT_DEFAULT };
    state.connections = {};
    write(LS.account, state.account);
    write(LS.connections, state.connections);
    state.accountBusy = false;
    toast("Sesión cerrada. Los conectores quedaron desconectados.");
    render();
  }, 700);
}

function renderDone() {
  const selected = CATALOG.filter((c) => state.selected.has(c.id));
  const connected = selected.filter((c) => isConnected(c.id)).length;
  app.innerHTML = `
    <main class="screen done-view">
      ${blob("#2f91f5", "lg")}
      <h1>¡Listo!</h1>
      <p>${selected.length ? `Configuraste <strong>${selected.length} herramientas</strong>${connected ? ` y autorizaste <strong>${connected}</strong> sesión${connected === 1 ? "" : "es"}` : ""}.` : "Sin herramientas por ahora."} Cada conector usa únicamente la cuenta que tú autorizaste y las sesiones quedan cifradas en este dispositivo.</p>
      ${selected.length ? `
        <div class="summary">
          ${selected.map((c, i) => `<span class="chip${isConnected(c.id) ? "" : " off"}" style="--i:${i}"><span class="tile">${c.svg}</span>${c.name}${isConnected(c.id) ? " <b>✓</b>" : ""}</span>`).join("")}
        </div>` : ""}
      <footer class="actions" style="margin-top:34px">
        <button id="back-to-pick" class="primary" type="button">Volver a elegir</button>
        <button id="back-home" class="ghost" type="button">Ir al inicio de la app</button>
      </footer>
    </main>`;
  document.getElementById("back-to-pick").addEventListener("click", () => { state.doneView = false; render(); });
  document.getElementById("back-home").addEventListener("click", () => { state.doneView = false; state.query = ""; state.selected.clear(); state.connections = {}; state.account = { ...ACCOUNT_DEFAULT }; write(LS.selected, []); write(LS.connections, {}); write(LS.account, state.account); render(); });
}

function delay(ms) { return new Promise((resolve) => setTimeout(resolve, ms)); }

// re-bind modal + disconnect actions after each render
const origRender = render;
render = function () {
  origRender();
  bindModal();
  document.querySelectorAll("[data-disconnect]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const id = btn.dataset.disconnect;
      delete state.connections[id];
      write(LS.connections, state.connections);
      toast(`${connector(id).name} desconectado`);
      render();
    });
  });
};
render();
</script>
</body>
</html>
